# Projeto "brasico-wa-rotina" na VPS da Hostinger (separado da Evolution, para não mexer nela nem nas senhas).
# Simula um usuário comum: desliga o contêiner evolution_api de madrugada e em 2-3 pausas curtas por dia,
# com horários sorteados todo dia. O código legível está em rotina.sh; abaixo vai o mesmo arquivo em base64,
# para o projeto rodar sem arquivos extras na VPS. Ao mudar rotina.sh: base64 -w0 rotina.sh e troque abaixo.
# Pausar a rotina: ATIVA "0" e atualizar o projeto (a Evolution volta a ficar sempre ligada).
services:
  rotina:
    image: docker:27-cli
    container_name: brasico_wa_rotina
    restart: unless-stopped
    environment:
      ATIVA: "1"
      ALVO: evolution_api
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c", "echo  | base64 -d > /tmp/rotina.sh && exec sh /tmp/rotina.sh"]
