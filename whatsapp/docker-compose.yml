# Evolution API: conecta o número da Brasico aos grupos e manda cada mensagem para o Supabase
# (Edge Function whatsapp-webhook). Cópia do projeto "evolution-api" do Docker Manager da VPS da Hostinger
# (conferida em 17/11/2026). As senhas ficam só no .env do projeto na VPS. Veja LEIA-ME.md.
# A rotina de pausas ("usuário comum") é outro projeto: rotina/docker-compose.yml (brasico-wa-rotina).
#
# CONFIG_SESSION_PHONE_NAME: Desktop = o aparelho aparece como app de computador no celular.
# Conecte SEMPRE pelo QR code: pelo código de 8 letras (número de telefone) a Evolution entra como Chrome.
services:
  caddy:
    image: caddy:2-alpine
    container_name: evolution_caddy
    restart: always
    depends_on:
      - evolution-api
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from wa.brasico.com.br --to evolution-api:8080
    volumes:
      - caddy_data:/data
      - caddy_config:/config

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      SERVER_URL: https://wa.brasico.com.br
      AUTHENTICATION_API_KEY: ${AUTHENTICATION_API_KEY}
      CONFIG_SESSION_PHONE_CLIENT: Brasico
      CONFIG_SESSION_PHONE_NAME: Desktop
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: evolution_brasico
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_HISTORIC: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      LANGUAGE: pt-BR
    volumes:
      - evolution_instances:/evolution/instances

  postgres:
    image: postgres:16-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
