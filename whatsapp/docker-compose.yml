# Evolution API: conecta o número da Brasico aos grupos e manda cada mensagem
# para o Supabase (Edge Function whatsapp-webhook). Roda na VPS. Veja LEIA-ME.md.
services:
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: brasico
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Brasico
      CONFIG_SESSION_PHONE_NAME: Chrome
      # Um webhook só, para todas as instâncias
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_SET: "true"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_GROUPS_UPSERT: "true"
      WEBHOOK_EVENTS_GROUP_UPDATE: "true"
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  # Rotina de "usuário comum": desliga a Evolution de madrugada e em 2-3 pausas curtas por dia, com horários
  # sorteados todo dia (código legível em rotina/rotina.sh; abaixo vai o mesmo arquivo em base64, para o
  # projeto rodar sem arquivos extras na VPS). Só liga/desliga o contêiner "evolution" deste projeto.
  # Para pausar a rotina: ATIVA: "0". Ao mudar rotina.sh, gere o base64 de novo (base64 -w0 rotina/rotina.sh).
  rotina:
    image: docker:27-cli
    restart: unless-stopped
    environment:
      ATIVA: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    entrypoint: ["sh", "-c", "echo  | base64 -d > /tmp/rotina.sh && exec sh /tmp/rotina.sh"]
    depends_on:
      - evolution

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
